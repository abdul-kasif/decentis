[package]
name = "decentisd"
version = "0.1.0"
edition = "2021"
authors = ["Abdul Kasif <abdulkasif.ra@gmail.com>"]
description = "High-Performance Core Data Plane Daemon for Decentis"

[[bin]]
name = "decentisd"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.53", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.14"
prost = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
tonic-prost = "0.14.6"
tun-rs = { version = "2.8", features = ["async"] }
bytes = "1.12"
quinn = { version = "0.11", features = ["rustls"] }
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
] }
snow = { version = "0.10", features = ["ring-accelerated"] }
chacha20poly1305 = "0.11"
rand = "0.10"
base64 = "0.23.1"
serde = { version = "1.0", features = ["derive"] }
postcard = { version = "1.1", features = ["alloc"] }
blake3 = { version = "1.8", features = ["rayon", "mmap"] }
bitvec = "1.1"

[build-dependencies]
tonic-prost-build = "0.14"
